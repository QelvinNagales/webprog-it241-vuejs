<!DOCTYPE html>
<html>
<head>
  <title>My first Vue page</title>
  <link rel="stylesheet" href="css/style.css?version=0.1">">
</head>
<body>

<h1>Vue Example</h1>

<p>The message is taken from 'data' inside the Vue instance by writing {{ message }} inside the div with id="app".</p>

<div id="app">
  {{ message }}
</div>

<div id="app2">
  <h2>v-for Directive with Images</h2>
  <div style="display: flex; flex-wrap: wrap; gap: 10px;">
    <img v-for="food in manyFoods" :src="food" alt="food image" style="width: 100px; height: 100px;">
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="js/app.js"></script>
<script src="js/image.js"></script>

</body>
</html>
